[project]
name = "yourqm_v1"
version = "1.1.0"
description = "Production-ready FastAPI backend and AI agent API for yourqm_v1 (Your Quality Manager - PCH Consulting)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "yourqm_v1 Engineering" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "PyJWT>=2.9,<3.0",
    "redis>=5.0,<7.0",
    "greenlet>=3.0",
    "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "S", "BLE"]
ignore = [
    "S101",   # assert (used in tests)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "SIM117", # nested with in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE001", "E501"]
"scripts/*" = ["S", "T201", "E501"]
"alembic/versions/*" = ["E501", "I001"]
"alembic/env.py" = ["I001"]
"app/agents/prompts.py" = ["E501"]
"app/agents/retrieval.py" = ["E501"]
"app/agents/providers.py" = ["BLE001"]
"app/middleware/*" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
